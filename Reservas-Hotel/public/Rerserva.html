<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reserva de Hotel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Reserva.css">
</head>
<body>
  <div class="container">
    <h1>Reservaciones</h1>
    <form class="booking-form" id="formReserva">

      <label for="name">Nombre completo</label>
      <input type="text" id="name" name="name" class="form-control" required>

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" class="form-control" required>

      <label for="guests">Número de personas</label>
      <input type="number" id="guests" name="guests" class="form-control" min="1" required>

      <div class="date-group">
        <div>
          <label for="checkin">Fecha de entrada</label>
          <input type="date" id="checkin" name="checkin" class="form-control" required>
        </div>
        <div>
          <label for="checkout">Fecha de salida</label>
          <input type="date" id="checkout" name="checkout" class="form-control" required>
        </div>
      </div>

      <label for="room">Tipo de habitación</label>
      <select id="room" name="room" class="form-select" required>
        <option value="">Seleccionar...</option>
        <option value="single">Individual</option>
        <option value="double">Doble</option>
        <option value="suite">Suite</option>
      </select>

      <label for="message">Comentarios adicionales</label>
      <textarea id="message" name="message" rows="4" class="form-control" placeholder="¿Tienes alguna solicitud especial?"></textarea>

      <button type="submit">Reservar ahora</button>
      <div id="mensaje" class="mt-3"></div>
    </form>
  </div>

  <div class="container tabla-container">
    <h1>Reservas registradas</h1>
    <div class="table-responsive">
      <table class="table table-striped table-bordered">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Personas</th>
            <th>Entrada</th>
            <th>Salida</th>
            <th>Habitación</th>
            <th>Comentarios</th>
          </tr>
        </thead>
        <tbody id="tablaReservas"></tbody>
      </table>
    </div>
  </div>

  <script>
    const form = document.getElementById('formReserva');
    const mensaje = document.getElementById('mensaje');
    const tipos = { single: 'Individual', double: 'Doble', suite: 'Suite' };

    async function cargarReservas() {
      const res = await fetch('/api/reservas');
      const datos = await res.json();
      const tbody = document.getElementById('tablaReservas');

      if (datos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center">No hay reservas registradas</td></tr>';
        return;
      }

      tbody.innerHTML = datos.map(r => `
        <tr>
          <td>${r.id}</td>
          <td>${r.nombre}</td>
          <td>${r.correo}</td>
          <td>${r.personas}</td>
          <td>${r.fecha_entrada}</td>
          <td>${r.fecha_salida}</td>
          <td>${tipos[r.habitacion]}</td>
          <td>${r.comentarios || ''}</td>
        </tr>`).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const datos = Object.fromEntries(new FormData(form));

      if (datos.checkout <= datos.checkin) {
        mensaje.className = 'alert alert-warning mt-3';
        mensaje.textContent = 'La fecha de salida debe ser posterior a la de entrada.';
        return;
      }

      const res = await fetch('/api/reservas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
      });

      if (res.ok) {
        mensaje.className = 'alert alert-success mt-3';
        mensaje.textContent = 'Reserva guardada correctamente.';
        form.reset();
        cargarReservas();
      } else {
        const err = await res.json();
        mensaje.className = 'alert alert-danger mt-3';
        mensaje.textContent = 'Error: ' + err.error;
      }
    });

    cargarReservas();
  </script>
</body>
</html>
